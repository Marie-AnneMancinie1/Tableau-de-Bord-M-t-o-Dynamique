<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <h1>Weather Dashboard</h1> 
        <nav>
            <span>Dashboard</span>
            <span>Forecast</span>
            <span>Map</span>
            <span>Alerts</span>
            <span>⚙️</span>
        </nav>
    </header>

    <main class="main-content">
        
        <div class="search-box">
            <form id="weather-form">
                <input type="text" id="city-input" placeholder="Search city..." required>
                <button type="submit">Search</button>
            </form>
        </div>

        <section id="weather-card" class="hidden">
            <h2 id="city-name">Jacmel, Haiti</h2>
            <p>Current Weather</p>
            
            <div class="weather-icon">☀️</div>
            <div id="temperature">21.5°C</div>
            
            <div class="footer-details">
                <div class="detail-item">
                    <span id="weather-status">Partly Cloudy</span>
                </div>
                <div class="detail-item">
                    <span id="wind-speed">14.2 km/h Wind Speed</span>
                </div>
            </div>
            
            <p class="update-time">Updated just now</p>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
